# Temporary development aid; removed before this PR is ready for review.
name: Localization development snapshot
on:
  pull_request:
    paths:
      - .github/workflows/development-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/community-social-launch-i18n17' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Archive tracked development inputs and locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          omitted = {'.mp3', '.ogg', '.wav', '.gif', '.mp4', '.webm', '.zip', '.7z', '.exe', '.dll', '.dmg', '.deb'}
          with tarfile.open('development-inputs.tar.gz', 'w:gz') as archive:
              for name in tracked:
                  if name and pathlib.Path(name).suffix.lower() not in omitted:
                      archive.add(name, recursive=False)
          PY
          tar -czf locked-node-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: localization-development-inputs
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            development-inputs.tar.gz
            locked-node-dependencies.tar.gz
