# Temporary development aid; removed before this PR is ready for review.
name: Localization development snapshot
on:
  pull_request:
    paths:
      - .github/workflows/development-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/community-social-launch-i18n17' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - name: Archive existing media and native test inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          media = {'.mp3', '.ogg', '.wav', '.gif', '.mp4', '.webm', '.zip', '.7z', '.exe', '.dll', '.dmg', '.deb'}
          with tarfile.open('development-fixtures.tar.gz', 'w:gz') as archive:
              for name in tracked:
                  if name and pathlib.Path(name).suffix.lower() in media:
                      archive.add(name, recursive=False)
              for binary in pathlib.Path('native/target/debug').glob('deltamod-*'):
                  if binary.is_file() and not binary.suffix:
                      archive.add(binary, recursive=False)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: localization-development-fixtures
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: development-fixtures.tar.gz
