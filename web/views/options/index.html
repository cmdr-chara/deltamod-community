<div class="content-page options-page">
    <div class="ingranaggio" aria-hidden="true">
        <span class="material-symbols-outlined ingranaggio-wheel ingranaggio-main">settings</span>
        <span class="material-symbols-outlined ingranaggio-wheel ingranaggio-secondary">settings</span>
        <span class="material-symbols-outlined ingranaggio-wheel ingranaggio-tertiary">settings</span>
    </div>
    <div class="page-heading">
        <h1 data-i18n="options">$$options$$</h1>
        <p data-i18n="community_options_subtitle">$$community_options_subtitle$$</p>
    </div>
    <div class="options-layout">
        <nav class="cat" aria-label="Settings categories" data-i18n-aria-label="ui_settings_categories_04ff6564">
            <button onclick="window.currentPageStack.cat('gen')" id="b_gen" class="noScaleBTN" data-icon="tune" data-i18n="optcat_general">$$optcat_general$$</button>
            <button onclick="window.currentPageStack.cat('ui')" id="b_ui" class="noScaleBTN" data-icon="palette" data-i18n="optcat_ui">$$optcat_ui$$</button>
            <button onclick="window.currentPageStack.cat('inst')" id="b_inst" class="noScaleBTN" data-icon="folder_open" data-i18n="optcat_installation">$$optcat_installation$$</button>
            <button onclick="window.currentPageStack.cat('data')" id="b_data" class="noScaleBTN" data-icon="database" data-i18n="optcat_data">$$optcat_data$$</button>
            <button onclick="window.currentPageStack.cat('adv')" id="b_adv" class="noScaleBTN" data-icon="terminal" data-i18n="optcat_advanced">$$optcat_advanced$$</button>
            <button onclick="window.currentPageStack.cat('gb')" id="b_gb" class="noScaleBTN" data-icon="public" data-i18n="optcat_gamebanana">$$optcat_gamebanana$$</button>
            <button onclick="window.currentPageStack.cat('nexus')" id="b_nexus" class="noScaleBTN" data-icon="hub" data-i18n="optcat_nexus">$$optcat_nexus$$</button>
            <button onclick="window.currentPageStack.cat('mac')" id="b_mac" style="display: none;" class="noScaleBTN" data-icon="laptop_mac" data-i18n="optcat_mac">Mac</button>
            <button onclick="window.currentPageStack.cat('dev')" id="b_dev" style="display: none;" class="noScaleBTN" data-icon="code" data-i18n="optcat_developer">$$optcat_developer$$</button>
        </nav>
        <div class="opt">
            <table id="modtable">
                <colgroup>
                    <col style="width: 80%;">
                    <col style="width: 20%;">
                </colgroup>
                <thead style="position: sticky; top: -2px;">
                    <tr>
                        <th data-i18n="option">$$option$$</th>
                        <th data-i18n="status">$$status$$</th>
                    </tr>
                </thead>
                <tbody id="options">
                    <tr>
                        <td colspan="2" style="text-align: center;" data-i18n="optcat_selectone">$$optcat_selectone$$</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

STYLESHEET[options]
JSL
TITLE[Options]
AUDIO[views/options/ost.mp3]
