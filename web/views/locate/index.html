<div class="locate-root">
    <h1 data-i18n="locate_title">$$locate_title$$</h1>
    <p class="calibri" data-i18n="locate_desc">$$locate_desc$$</p>
    <div class="locate-panel">
        <p class="locate-step">
            <span class="material-symbols-outlined" aria-hidden="true">gamepad_up</span>
            <span data-i18n="locate_selectgame">$$locate_selectgame$$</span>
        </p>
        <div class="gOptions" role="group" aria-label="$$locate_selectgame$$" data-i18n-aria-label="locate_selectgame"></div>
        <p class="locate-step">
            <span class="material-symbols-outlined" aria-hidden="true">folder</span>
            <span data-i18n="locate_selectfolder">$$locate_selectfolder$$</span>
        </p>
        <div class="fileInput">
            <input type="text" id="dpath" placeholder="$$locate_path_placeholder$$" autocomplete="off" data-i18n-placeholder="locate_path_placeholder">
            <button class="folder-picker-button secondary-action" type="button" onclick="window.currentPageStack.locateDelta()" aria-label="$$locate_selectfolder$$" data-i18n-aria-label="locate_selectfolder">
                <span class="material-symbols-outlined" aria-hidden="true">folder_open</span>
            </button>
        </div>
        <p class="smaller locate-other" data-i18n="locate_other_methods">$$locate_other_methods$$</p>
        <div class="otherImports">
            <button class="secondary-action" type="button" onclick="window.currentPageStack.steam()" id="feat_steam">
                <brand-icon style="font-size: 14px;" aria-hidden="true">S</brand-icon> <span data-i18n="locate_steam_import">$$locate_steam_import$$</span>
            </button>
            <button class="secondary-action" type="button" onclick="window.currentPageStack.downloadDelta()" id="feat_autodownload">
                <span class="material-symbols-outlined" style="font-size: 14px;" aria-hidden="true">cloud_download</span> <span data-i18n="locate_autodownload">$$locate_autodownload$$</span>
            </button>
        </div>
    </div>
    <section id="gameImportProgress" class="importProgress" hidden aria-live="polite">
        <div><strong id="gameImportPhase" data-i18n="ui_preparing_import_b6ff290e">Preparing import…</strong> <span id="gameImportAmount"></span></div>
        <progress id="gameImportBar" value="0" max="1"></progress>
        <small id="gameImportFile" class="calibri"></small>
        <button id="cancelGameImport" class="secondary-action" type="button" data-i18n="ui_cancel_import_73da9a98">Cancel import</button>
    </section>
    <div class="locate-actions">
        <div class="copyAnyways">
            <input type="checkbox" id="copyAnyways">
            <label for="copyAnyways" data-i18n="locate_copyanyways">$$locate_copyanyways$$</label>
        </div>
        <button class="locate-save" type="button" onclick="window.currentPageStack.id()" data-i18n="save_and_close">$$save_and_close$$</button>
    </div>
</div>
STYLESHEET[index]
JSL
AUDIO[mainTheme.mp3]
TITLE[$$locate_title$$]
