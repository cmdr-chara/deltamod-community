<div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
    <div class="patch-status-panel">
        <p style="font-size: 25px; margin-bottom: 0;" class="iconhoster" id="patchingTXT" role="status"><span class="material-symbols-outlined rotate" aria-hidden="true">cycle</span><i data-i18n="patch_title">Patching the game…</i></p>
        <p class="calibri" id="patchingDesc" data-i18n="patch_description">Please wait while your selected mods are prepared and verified.</p>
        <div class="patch-stage-info"><strong id="patch-phase" role="status" data-i18n="patch_phase_preparing">Preparing</strong><output id="patch-step"></output></div>
        <bdi id="patch-item" class="patch-current-item" dir="auto"></bdi>
        <div class="patch-progress-info"><label for="patch-progress" data-i18n="refine_progress">$$refine_progress$$</label><output id="patch-percent" for="patch-progress"></output></div>
        <progress id="patch-progress" max="100"></progress>
        <h2 class="patch-log-heading" data-i18n="patch_log_heading">Activity log</h2>
        <div class="logs" id="gpl" tabindex="0" role="region" aria-label="$$refine_patch_log$$" data-i18n-aria-label="refine_patch_log" aria-describedby="patch-log-limit"></div>
        <p id="patch-log-limit" class="calibri patch-log-limit" data-i18n="patch_log_limit">The most recent 300 log entries are shown.</p>
    </div>
</div>


<div class="buttons">
    <button onclick="window.currentPageStack.next()" id="next" style="display: none;" data-i18n="patch_return">Return to mod list</button>
</div>
JSL
NO-SIDEBAR
STYLESHEET[style]
TITLE[$$patch_title$$]
AUDIO[views/patching/patching.mp3]
